<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BookMind 面试闯关 · Agent 学习地图</title>
<style>
  :root {
    --paper: #f6f2e8;
    --paper-2: #fbf8f1;
    --ink: #1e2a24;
    --ink-soft: #52605a;
    --green: #175b4b;
    --green-2: #2d7a67;
    --green-3: #dfece7;
    --gold: #c98a3f;
    --gold-soft: #f3e2c8;
    --line: #dcd5c6;
    --danger: #a8483f;
    --danger-soft: #f5e2de;
    --ok: #2f6b4f;
    --ok-soft: #e1efe6;
    --shadow: 0 10px 30px rgba(44, 54, 48, 0.08);
    --radius: 18px;
    --serif: "Noto Serif SC", "Songti SC", "SimSun", Georgia, serif;
    --sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    min-height: 100vh;
    color: var(--ink);
    font-family: var(--sans);
    background:
      radial-gradient(circle at 12% 8%, rgba(201, 138, 63, 0.10), transparent 32%),
      radial-gradient(circle at 88% 18%, rgba(23, 91, 75, 0.08), transparent 30%),
      linear-gradient(180deg, var(--paper-2), var(--paper));
    background-attachment: fixed;
  }

  button, input { font: inherit; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible {
    outline: 3px solid rgba(201, 138, 63, 0.55);
    outline-offset: 2px;
  }

  .app { max-width: 1240px; margin: 0 auto; padding: 20px 20px 80px; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 18px; padding: 14px 18px; margin-bottom: 22px;
    background: rgba(251, 248, 241, 0.88);
    border: 1px solid var(--line);
    border-radius: 999px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(10px);
    position: sticky; top: 12px; z-index: 20;
  }

  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand-mark {
    width: 38px; height: 38px; border-radius: 12px;
    background: var(--green); color: #fff;
    display: grid; place-items: center; flex: 0 0 auto;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,0.12);
  }
  .brand-mark svg { width: 22px; height: 22px; }
  .brand-title { font-family: var(--serif); font-weight: 700; font-size: 17px; line-height: 1.1; white-space: nowrap; }
  .brand-sub { font-size: 11px; letter-spacing: 0.16em; color: var(--ink-soft); text-transform: uppercase; }

  .stats { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  .stat {
    display: flex; align-items: center; gap: 7px;
    padding: 7px 12px; border-radius: 999px;
    background: var(--paper); border: 1px solid var(--line);
    font-size: 13px; color: var(--ink-soft); white-space: nowrap;
  }
  .stat strong { color: var(--ink); font-size: 14px; }
  .timer-btn {
    border: 1px solid var(--green); color: var(--green); background: transparent;
    padding: 7px 12px; border-radius: 999px; font-size: 13px; font-weight: 600;
  }
  .timer-btn:hover { background: var(--green-3); }

  .storage-badge {
    border: 1px solid var(--line); background: var(--paper); color: var(--ink-soft);
    padding: 7px 11px; border-radius: 999px; font-size: 12px; white-space: nowrap;
  }
  .storage-badge:hover { border-color: var(--green); color: var(--green); }
  .storage-badge.remote { background: var(--ok-soft); border-color: #b7d8c4; color: var(--ok); }
  .storage-badge.error { background: var(--danger-soft); border-color: #e2bdb6; color: var(--danger); }

  .shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); gap: 22px; align-items: start; }

  .sidebar {
    position: sticky; top: 92px;
    background: rgba(251, 248, 241, 0.76);
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px; box-shadow: var(--shadow);
  }

  .nav-title {
    font-size: 11px; letter-spacing: 0.18em; color: var(--ink-soft);
    text-transform: uppercase; margin: 0 0 10px 6px;
  }

  .mode-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 18px; }
  .mode-btn {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 10px 12px; border-radius: 12px;
    border: 1px solid transparent; background: transparent;
    color: var(--ink-soft); text-align: left; font-size: 14px;
  }
  .mode-btn:hover { background: var(--green-3); color: var(--green); }
  .mode-btn.active { background: var(--green); color: #fff; box-shadow: 0 6px 16px rgba(23,91,75,0.22); }
  .mode-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: 0.7; flex: 0 0 auto; }

  .level-list { display: grid; gap: 7px; max-height: 46vh; overflow: auto; padding-right: 2px; }
  .level-item {
    display: grid; grid-template-columns: 28px 1fr auto; gap: 9px; align-items: center;
    padding: 9px 10px; border-radius: 12px; border: 1px solid transparent;
    background: transparent; text-align: left; color: var(--ink); width: 100%;
  }
  .level-item:hover { background: var(--green-3); }
  .level-item.active { border-color: var(--green); background: var(--green-3); }
  .level-num {
    width: 26px; height: 26px; border-radius: 9px; display: grid; place-items: center;
    background: var(--paper); border: 1px solid var(--line);
    font-size: 12px; font-weight: 700; color: var(--ink-soft);
  }
  .level-item.done .level-num { background: var(--green); color: #fff; border-color: var(--green); }
  .level-item.active .level-num { border-color: var(--green); }
  .level-name { font-size: 13px; font-weight: 600; line-height: 1.25; }
  .level-meta { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }
  .level-best { font-size: 11px; color: var(--green); font-weight: 700; }

  .sidebar-note {
    margin-top: 16px; padding: 12px; border-radius: 12px;
    background: var(--gold-soft); color: #6a4a20; font-size: 12px; line-height: 1.6;
  }

  .main { min-width: 0; }

  .hero {
    position: relative; overflow: hidden;
    padding: 34px 32px; border-radius: 26px;
    background: linear-gradient(135deg, #123f35, #1d6a55 62%, #2f8a70);
    color: #fff; box-shadow: 0 18px 44px rgba(18, 63, 53, 0.22);
    margin-bottom: 20px;
  }
  .hero::after {
    content: ""; position: absolute; right: -80px; top: -100px;
    width: 300px; height: 300px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.14), transparent 65%);
  }
  .hero-kicker { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; opacity: 0.78; margin-bottom: 10px; }
  .hero h1 { font-family: var(--serif); font-size: clamp(26px, 4vw, 40px); line-height: 1.22; margin: 0 0 10px; font-weight: 700; }
  .hero p { margin: 0; max-width: 640px; color: rgba(255,255,255,0.84); line-height: 1.7; font-size: 14px; }
  .hero-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; position: relative; z-index: 1; }

  .btn {
    border: 1px solid transparent; border-radius: 12px; padding: 11px 18px;
    font-weight: 650; font-size: 14px; transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn-primary { background: var(--gold); color: #2a1b07; box-shadow: 0 6px 16px rgba(0,0,0,0.16); }
  .btn-primary:hover { background: #d99a4e; }
  .btn-light { background: rgba(255,255,255,0.14); color: #fff; border-color: rgba(255,255,255,0.25); }
  .btn-light:hover { background: rgba(255,255,255,0.22); }
  .btn-ghost { background: transparent; color: var(--green); border-color: var(--green); }
  .btn-ghost:hover { background: var(--green-3); }
  .btn-soft { background: var(--paper); color: var(--ink); border-color: var(--line); }
  .btn-soft:hover { background: #efe9db; }
  .btn-danger-soft { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

  .grid { display: grid; gap: 16px; }
  .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }

  .card {
    background: var(--paper-2); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow);
  }
  .card h2, .card h3 { font-family: var(--serif); margin: 0 0 8px; line-height: 1.3; }
  .card h2 { font-size: 20px; }
  .card h3 { font-size: 16px; }
  .muted { color: var(--ink-soft); }
  .small { font-size: 12px; line-height: 1.6; }

  .progress-line { height: 9px; border-radius: 999px; background: #e7e0d1; overflow: hidden; }
  .progress-line > span { display: block; height: 100%; background: linear-gradient(90deg, var(--green-2), var(--green)); border-radius: inherit; transition: width 0.4s ease; }

  .stat-big { font-family: var(--serif); font-size: 30px; font-weight: 700; line-height: 1; }
  .stat-label { font-size: 12px; color: var(--ink-soft); margin-top: 6px; }

  .level-card {
    display: flex; flex-direction: column; gap: 10px; text-align: left;
    background: var(--paper-2); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow);
    transition: transform 0.14s ease, border-color 0.14s ease;
  }
  .level-card:hover { transform: translateY(-2px); border-color: var(--green-2); }
  .level-card-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .level-card h3 { margin: 0; font-size: 17px; }
  .level-card p { margin: 0; color: var(--ink-soft); font-size: 13px; line-height: 1.55; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 9px; border-radius: 999px; font-size: 11px; font-weight: 650;
    background: var(--green-3); color: var(--green); white-space: nowrap;
  }
  .pill.gold { background: var(--gold-soft); color: #7a531e; }
  .pill.grey { background: #ece7db; color: var(--ink-soft); }

  .plan-list { display: grid; gap: 10px; }
  .plan-item {
    display: grid; grid-template-columns: 26px 92px 1fr; gap: 12px; align-items: start;
    padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper-2);
  }
  .plan-item.done { opacity: 0.62; }
  .plan-check {
    width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid var(--line);
    background: #fff; display: grid; place-items: center; margin-top: 1px; padding: 0;
  }
  .plan-check.checked { background: var(--green); border-color: var(--green); }
  .plan-check.checked::after {
    content: ""; width: 6px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0;
    transform: rotate(45deg) translateY(-1px);
  }
  .plan-time { font-size: 12px; font-weight: 700; color: var(--green); }
  .plan-title { font-size: 14px; font-weight: 650; }
  .plan-desc { font-size: 12px; color: var(--ink-soft); line-height: 1.6; margin-top: 2px; }

  .quiz-wrap { max-width: 860px; margin: 0 auto; }
  .quiz-top { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 14px; }
  .quiz-top-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .quiz-title { font-family: var(--serif); font-size: 20px; font-weight: 700; }
  .dots { display: flex; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #ddd5c6; }
  .dot.current { background: var(--green); transform: scale(1.25); }
  .dot.correct { background: var(--green-2); }
  .dot.wrong { background: var(--danger); }

  .question-card { background: var(--paper-2); border: 1px solid var(--line); border-radius: 22px; padding: 28px; box-shadow: var(--shadow); }
  .q-tag { display: inline-block; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; }
  .q-prompt { font-family: var(--serif); font-size: clamp(20px, 2.6vw, 26px); line-height: 1.5; margin: 0 0 20px; font-weight: 700; }

  .options { display: grid; gap: 10px; }
  .option {
    display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: center;
    width: 100%; text-align: left; padding: 14px 16px;
    border-radius: 14px; border: 1.5px solid var(--line); background: #fff;
    color: var(--ink); line-height: 1.55; font-size: 14px;
    transition: border-color 0.12s ease, background 0.12s ease, transform 0.12s ease;
  }
  .option:hover { border-color: var(--green-2); background: #f3faf7; transform: translateX(2px); }
  .option.selected { border-color: var(--green); background: var(--green-3); }
  .option.correct { border-color: var(--ok); background: var(--ok-soft); }
  .option.wrong { border-color: var(--danger); background: var(--danger-soft); }
  .option:disabled { cursor: default; transform: none; }
  .option-key {
    width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
    background: var(--paper); border: 1px solid var(--line); font-size: 12px; font-weight: 700; color: var(--ink-soft);
  }
  .option.selected .option-key { background: var(--green); color: #fff; border-color: var(--green); }
  .option.correct .option-key { background: var(--ok); color: #fff; border-color: var(--ok); }
  .option.wrong .option-key { background: var(--danger); color: #fff; border-color: var(--danger); }

  .quiz-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; flex-wrap: wrap; }

  .feedback {
    margin-top: 20px; border-radius: 16px; padding: 18px;
    border: 1px solid var(--line); background: var(--paper);
  }
  .feedback.ok { border-color: #b7d8c4; background: #f0f8f3; }
  .feedback.bad { border-color: #e2bdb6; background: #fbf1ee; }
  .feedback-head { display: flex; align-items: center; gap: 8px; font-weight: 700; margin-bottom: 8px; }
  .feedback-head .mark {
    width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
    color: #fff; font-size: 12px; background: var(--ok);
  }
  .feedback.bad .mark { background: var(--danger); }
  .feedback p { margin: 6px 0; line-height: 1.7; font-size: 14px; }
  .feedback .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  .mini-card { background: rgba(255,255,255,0.7); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .mini-card .label { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 4px; }
  .mini-card .text { font-size: 13px; line-height: 1.6; }

  .result-card { text-align: center; max-width: 720px; margin: 0 auto; }
  .score-ring {
    width: 150px; height: 150px; border-radius: 50%; margin: 6px auto 16px;
    display: grid; place-items: center; position: relative;
    background: conic-gradient(var(--green) 0deg, var(--green) var(--deg), #e7e0d1 var(--deg));
  }
  .score-ring::before { content: ""; position: absolute; inset: 12px; border-radius: 50%; background: var(--paper-2); }
  .score-inner { position: relative; z-index: 1; }
  .score-num { font-family: var(--serif); font-size: 36px; font-weight: 700; line-height: 1; }
  .score-sub { font-size: 11px; color: var(--ink-soft); margin-top: 4px; }

  .badge-banner {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 14px; border-radius: 999px; background: var(--gold-soft); color: #6a4a20;
    font-weight: 700; font-size: 13px; margin: 6px 0 14px;
  }
  .badge-shape { width: 14px; height: 14px; background: var(--gold); transform: rotate(45deg); border-radius: 3px; }

  .review-list { display: grid; gap: 8px; text-align: left; margin-top: 14px; }
  .review-row { padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); font-size: 13px; line-height: 1.5; }

  .flash-stage { max-width: 760px; margin: 0 auto; }
  .flash-card {
    min-height: 320px; border-radius: 24px; border: 1px solid var(--line);
    background: linear-gradient(160deg, #fffdf8, #f1eadb);
    box-shadow: var(--shadow); padding: 30px; display: flex; flex-direction: column;
    justify-content: center; cursor: pointer; user-select: none;
  }
  .flash-card:hover { border-color: var(--green-2); }
  .flash-term { font-family: var(--serif); font-size: clamp(28px, 5vw, 44px); font-weight: 700; text-align: center; }
  .flash-en { text-align: center; color: var(--ink-soft); font-size: 13px; margin-top: 4px; }
  .flash-hint { text-align: center; color: var(--ink-soft); font-size: 12px; margin-top: 24px; }
  .flash-back { display: none; }
  .flash-card.flipped .flash-front { display: none; }
  .flash-card.flipped .flash-back { display: block; }
  .flash-back p { line-height: 1.75; font-size: 15px; margin: 8px 0; }
  .flash-back .label { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); margin-top: 14px; }
  .flash-controls { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }

  .glossary-search {
    width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line);
    background: #fff; color: var(--ink); margin-bottom: 14px;
  }
  .glossary-list { display: grid; gap: 8px; }
  .glossary-item { border: 1px solid var(--line); border-radius: 12px; background: var(--paper-2); overflow: hidden; }
  .glossary-head {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 13px 15px; background: transparent; border: 0; text-align: left; color: var(--ink);
  }
  .glossary-head:hover { background: var(--green-3); }
  .glossary-term { font-weight: 700; font-size: 14px; }
  .glossary-en { font-size: 11px; color: var(--ink-soft); margin-left: 8px; font-weight: 400; }
  .glossary-cat { font-size: 10px; padding: 3px 8px; border-radius: 999px; background: var(--gold-soft); color: #6a4a20; white-space: nowrap; }
  .glossary-body { display: none; padding: 0 15px 15px; }
  .glossary-item.open .glossary-body { display: block; }
  .glossary-body p { margin: 8px 0; font-size: 13px; line-height: 1.7; }
  .glossary-body .label { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); }

  .timer-card { display: flex; align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap; }
  .timer-display { font-family: var(--serif); font-size: 44px; font-weight: 700; letter-spacing: 0.04em; }

  .checklist { display: grid; gap: 9px; }
  .check-row {
    display: grid; grid-template-columns: 24px 1fr; gap: 11px; align-items: start;
    padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper-2);
    cursor: pointer;
  }
  .check-row.checked { background: var(--ok-soft); border-color: #b7d8c4; }
  .check-box { width: 21px; height: 21px; border-radius: 6px; border: 1.5px solid var(--line); background: #fff; display: grid; place-items: center; margin-top: 1px; }
  .check-row.checked .check-box { background: var(--green); border-color: var(--green); }
  .check-row.checked .check-box::after { content: ""; width: 5px; height: 9px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg) translateY(-1px); }
  .check-text { font-size: 13px; line-height: 1.6; }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--ink-soft); }
  .empty-state h3 { font-family: var(--serif); color: var(--ink); }

  /* ---------- 进阶训练 ---------- */
  .stage-strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stage-card {
    border: 1px solid var(--line); border-radius: 16px; padding: 15px;
    background: var(--paper-2); text-align: left; color: var(--ink);
  }
  .stage-card:hover { border-color: var(--green-2); }
  .stage-card.active { border-color: var(--green); background: var(--green-3); }
  .stage-card .stage-num { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); }
  .stage-card h3 { font-family: var(--serif); font-size: 17px; margin: 4px 0 6px; }
  .stage-card p { margin: 0; font-size: 12px; color: var(--ink-soft); line-height: 1.55; }
  .stage-card .stage-meta { margin-top: 9px; font-size: 11px; color: var(--green); font-weight: 700; }

  .type-badge {
    display: inline-block; padding: 3px 8px; border-radius: 999px;
    background: var(--gold-soft); color: #6a4a20; font-size: 10px; font-weight: 700;
    margin-left: 6px; vertical-align: middle;
  }
  .type-badge.green { background: var(--green-3); color: var(--green); }
  .type-badge.red { background: var(--danger-soft); color: var(--danger); }

  .multi-mark {
    width: 20px; height: 20px; border-radius: 5px; border: 1.5px solid var(--line);
    display: inline-block; flex: 0 0 auto; background: #fff;
  }
  .option.selected .multi-mark { background: var(--green); border-color: var(--green); }
  .option.selected .multi-mark::after {
    content: ""; display: block; width: 5px; height: 9px; margin: 3px auto 0;
    border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg);
  }

  .order-list { display: grid; gap: 8px; }
  .order-item {
    display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: center;
    width: 100%; text-align: left; padding: 12px 14px;
    border: 1.5px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink);
  }

function hashString(text) {
  let hash = 2166136261;
  for (let i = 0; i < text.length; i++) {
    hash ^= text.charCodeAt(i);
    hash = Math.imul(hash, 16777619);
  }
  return hash >>> 0;
}

function seededRandom(seed) {
  let value = seed >>> 0;
  return function next() {
    value += 0x6D2B79F5;
    let t = value;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function shuffleInPlace(array, rng) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function prepareQuestions() {
  const targetDeck = [];
  function nextTarget(optionCount) {
    if (!targetDeck.length) {
      for (let i = 0; i < 4; i++) targetDeck.push(i % optionCount);
      shuffleInPlace(targetDeck, Math.random);
    }
    return targetDeck.pop() % optionCount;
  }
  allLevels().forEach(level => {
    level.questions.forEach(q => {
      if (q.__prepared) return;
      q.__prepared = true;
      const fix = QUESTION_FIXES[q.id];
      if (fix) {
        q.options = fix.options.slice();
        q.answer = fix.correct;
        q.why = fix.why;
      }
      if (COMPACT_CORRECT[q.id] && q.type !== "multi" && q.type !== "order" && q.type !== "open") {
        q.options[q.answer] = COMPACT_CORRECT[q.id];
      }
      if (q.type === "open" || q.type === "order") return;

      const oldOptions = q.options.slice();
      if (q.type === "multi") {
        const order = oldOptions.map((_, index) => index);
        shuffleInPlace(order, seededRandom(hashString(q.id)));
        q.options = order.map(index => oldOptions[index]);
        q.answer = q.answer.map(index => order.indexOf(index)).sort((a, b) => a - b);
        return;
      }

      const correctText = oldOptions[q.answer];
      const others = oldOptions.filter((_, index) => index !== q.answer);
      shuffleInPlace(others, seededRandom(hashString(q.id)));
      const target = nextTarget(oldOptions.length);
      const newOptions = others.slice();
      newOptions.splice(target, 0, correctText);
      q.options = newOptions;
      q.answer = target;
    });
  });
}

function normalizeState(parsed) {
  const source = parsed && typeof parsed === "object" ? parsed : {};
  const asObject = value => (value && typeof value === "object" && !Array.isArray(value) ? value : {});
  const asArray = value => (Array.isArray(value) ? value : []);
  return {
    ...defaultState,
    ...source,
    xp: Number(source.xp) || 0,
    streak: Number(source.streak) || 0,
    completed: asObject(source.completed),
    advCompleted: asObject(source.advCompleted),
    wrong: asObject(source.wrong),
    correctOnce: asObject(source.correctOnce),
    ratings: asObject(source.ratings),
    schedule: asObject(source.schedule),
    openDone: asObject(source.openDone),
    mockHistory: asArray(source.mockHistory),
    flash: asObject(source.flash),
    plan: asObject(source.plan),
    boss: asObject(source.boss),
    stats: { ...defaultState.stats, ...asObject(source.stats) },
    lastStudy: typeof source.lastStudy === "string" ? source.lastStudy : "",
    updatedAt: Number(source.updatedAt) || 0
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return normalizeState(null);
    return normalizeState(JSON.parse(raw));
  } catch (err) {
    return normalizeState(null);
  }
}

function persistLocal() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (err) { /* 无痕模式忽略 */ }
}

function hasProgress(snapshot) {
  if (!snapshot) return false;
  return Boolean(
    (snapshot.xp || 0) > 0 ||
    Object.keys(snapshot.completed || {}).length ||
    Object.keys(snapshot.advCompleted || {}).length ||
    Object.keys(snapshot.wrong || {}).length ||
    Object.keys(snapshot.correctOnce || {}).length ||
    Object.keys(snapshot.ratings || {}).length ||
    Object.keys(snapshot.openDone || {}).length ||
    (snapshot.mockHistory || []).length
  );
}

function saveState() {
  state.updatedAt = Date.now();
  persistLocal();
  if (storageMode === "remote") {
    clearTimeout(syncTimer);
    syncTimer = setTimeout(() => { pushRemoteState(); }, 350);
  }
}

function setStorageBadge() {
  const badge = document.getElementById("storageBadge");
  if (!badge) return;
  badge.classList.remove("remote", "error");
  if (storageMode === "remote" && syncState === "error") {
    badge.textContent = "SQLite 同步失败";
    badge.classList.add("error");
  } else if (storageMode === "remote") {
    badge.textContent = "SQLite 已同步";
    badge.classList.add("remote");
  } else {
    badge.textContent = "浏览器本地";
  }
}

async function pushRemoteState() {
  if (storageMode !== "remote") return false;
  try {
    const res = await fetch(QUIZ_API + "/api/state", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ state }),
      keepalive: true
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || "save failed");
    syncState = "synced";
    setStorageBadge();
    return true;
  } catch (err) {
    syncState = "error";
    setStorageBadge();
    return false;
  }
}

async function initRemoteSync(force) {
  try {
    const res = await fetch(QUIZ_API + "/api/state", { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    storageMode = "remote";
    const remoteRaw = data.state;
    const remote = remoteRaw ? normalizeState(remoteRaw) : null;
    const local = state;
    const remoteHas = !!remoteRaw;
    const localHas = hasProgress(local);

    if (remote && remoteHas && (!localHas || (remote.updatedAt || 0) > (local.updatedAt || 0))) {
      state = remote;
      persistLocal();
      toast("已从 SQLite 恢复学习记录");
    } else if (localHas && (!remoteHas || (local.updatedAt || 0) > (remote.updatedAt || 0))) {
      await pushRemoteState();
      toast("已把本地记录写入 SQLite");
    } else if (remote && remoteHas) {
      state = remote;
      persistLocal();
    }

    syncState = "synced";
    setStorageBadge();
    render();
  } catch (err) {
    storageMode = "local";
    syncState = "local";
    setStorageBadge();
    if (force) toast("未连接 SQLite 服务，当前使用浏览器本地存储");
  }
}

function exportBackup() {
  const payload = {
    app: "bookmind-interview-quiz",
    schema: 1,
    exportedAt: new Date().toISOString(),

  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });

  const a = document.createElement("a");
  a.href = url;
  a.download = "bookmind-答题记录-" + todayKey() + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast("已导出 JSON 备份");
}

function importBackup(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(String(reader.result));
      const incoming = normalizeState(data.state || data);
      if (!hasProgress(incoming) && !window.confirm("这个备份看起来没有学习记录，仍要导入吗？")) return;
      state = incoming;
      saveState();
      ui.view = "dashboard";
      render();
      toast("备份已导入");
    } catch (err) {
      toast("导入失败：文件不是有效的 JSON 备份");
    }
  };
  reader.readAsText(file);
}

function todayKey() {
  const d = new Date();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return d.getFullYear() + "-" + m + "-" + day;
}

function yesterdayKey() {
  const d = new Date();
  d.setDate(d.getDate() - 1);
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return d.getFullYear() + "-" + m + "-" + day;
}

function touchStreak() {
  const today = todayKey();
  if (state.lastStudy === today) return;
  if (state.lastStudy === yesterdayKey()) state.streak = (state.streak || 0) + 1;
  else state.streak = 1;
  state.lastStudy = today;
}

function totalQuestions() {
  return LEVELS.reduce((sum, lv) => sum + lv.questions.length, 0);
}

function completedCount() {

}

function accuracy() {
  const a = state.stats.answered || 0;
  if (!a) return 0;
  return Math.round((state.stats.correct / a) * 100);
}

function isPassed(record) {
  return !!record && record.total > 0 && (record.best / record.total) >= 0.8;
}

function allLevels() {
  return [...LEVELS, ...ADVANCED_LEVELS];
}

function allQuestionsById() {
  const map = {};
  allLevels().forEach(lv => lv.questions.forEach(q => { map[q.id] = { level: lv, question: q }; }));
  return map;
}

function allObjectiveEntries() {
  return allLevels().flatMap(lv =>
    lv.questions
      .filter(q => q.type !== "open")
      .map(q => ({ level: lv, question: q }))
  );
}

function advancedObjectiveCount() {
  return ADVANCED_LEVELS
    .filter(lv => lv.stage === "apply")
    .reduce((sum, lv) => sum + lv.questions.filter(q => q.type !== "open").length, 0);
}

function openQuestions() {
  return ADVANCED_LEVELS.flatMap(lv =>
    lv.questions.filter(q => q.type === "open").map(q => ({ level: lv, question: q }))
  );
}

function isObjective(q) {
  return q && q.type !== "open";
}

function dueQuestionIds() {
  const now = Date.now();
  const ids = new Set(Object.keys(state.wrong || {}));
  Object.entries(state.schedule || {}).forEach(([id, item]) => {
    if (item && typeof item.due === "number" && item.due <= now) ids.add(id);
  });
  const map = allQuestionsById();
  return [...ids].filter(id => map[id] && isObjective(map[id].question));
}

function dueCount() {
  return dueQuestionIds().length;
}

function tagMastery() {
  const stats = {};
  allObjectiveEntries().forEach(({ question }) => {
    const tag = question.tag || "其他";
    if (!stats[tag]) stats[tag] = { total: 0, correct: 0 };
    stats[tag].total += 1;
    if (state.correctOnce[question.id]) stats[tag].correct += 1;
  });
  return Object.entries(stats)
    .map(([tag, value]) => ({
      tag,
      total: value.total,
      correct: value.correct,
      pct: value.total ? Math.round((value.correct / value.total) * 100) : 0
    }))
    .filter(item => item.total >= 2)
    .sort((a, b) => b.total - a.total || a.pct - b.pct)
    .slice(0, 10);
}

function scheduleLabel(qid) {
  const item = state.schedule[qid];
  if (!item) return "";
  const days = Math.max(0, Math.ceil((item.due - Date.now()) / 86400000));
  if (days <= 0) return "现在复习";
  return days + " 天后复习";
}

function applyRating(qid, rating) {
  const boxTable = [0, 1, 3, 7, 14];
  const current = state.schedule[qid] || { box: 0 };
  let box = current.box || 0;
  if (rating === 0) box = Math.min(box + 1, boxTable.length - 1);
  else if (rating === 1) box = Math.max(1, box);
  else box = 0;
  const days = boxTable[box] || 0;
  state.ratings[qid] = rating;
  state.schedule[qid] = {
    box,
    due: Date.now() + (rating === 2 ? 0 : days * 86400000),
    last: Date.now()
  };
  saveState();
  const label = rating === 0 ? "秒懂" : rating === 1 ? "想了一会" : "没思路";
  toast(label + "，已安排复习：" + scheduleLabel(qid));
}

function nextLevel() {
  const unfinished = LEVELS.find(lv => !state.completed[lv.id]);
  return unfinished || LEVELS[0];
}

function findLevelIndex(id) {
  return LEVELS.findIndex(lv => lv.id === id);
}

function el(html) {
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function toast(message) {
  const node = document.getElementById("toast");

  node.classList.add("show");

}

function confetti() {
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const layer = document.getElementById("confetti");
  const colors = ["#175b4b", "#2d7a67", "#c98a3f", "#e1b879", "#7aa89a"];
  for (let i = 0; i < 36; i++) {
    const piece = document.createElement("div");
    piece.className = "confetti-piece";
    piece.style.left = (Math.random() * 100) + "%";
    piece.style.top = "-20px";
    piece.style.background = colors[i % colors.length];
    piece.style.setProperty("--dx", (Math.random() * 160 - 80) + "px");
    piece.style.setProperty("--rot", (Math.random() * 720 - 360) + "deg");
    piece.style.animationDelay = (Math.random() * 0.35) + "s";
    layer.appendChild(piece);
    setTimeout(() => piece.remove(), 2200);
  }
}

      view === ui.view ||
      (view === "quiz" && ui.view === "quiz") ||
      (view === "advanced" && ui.view === "advanced") ||
      (view === "advanced" && ui.view === "open") ||
      (view === "advanced" && ui.view === "flow" && flowMode === "advanced") ||

          '<div class="plan-item">' +

  return wrap;

/* ---------- 闯关 ---------- */

function startLevel(index, review) {
  ui.view = "quiz";
  ui.levelIndex = index;
  ui.qIndex = 0;
  ui.selected = null;
  ui.answered = false;
  ui.review = !!review;
  ui.result = null;
  ui.runAnswers = {};
  ui.reviewQueue = review ? Object.keys(state.wrong) : [];
  if (review && ui.reviewQueue.length === 0) {
    toast("没有待复习的错题，先去闯关吧。");
    ui.view = "dashboard";
    render();
    return;
  }
  render();
}

function currentQuestions() {
  if (ui.review) {
    const map = allQuestionsById();
    return ui.reviewQueue.map(id => map[id]).filter(Boolean);
  }
  const lv = LEVELS[ui.levelIndex];
  return lv ? lv.questions.map(q => ({ level: lv, question: q })) : [];
}

function renderQuiz() {
  const wrap = el('<div class="quiz-wrap"></div>');
  const entries = currentQuestions();

  if (ui.result) {
    wrap.appendChild(renderResult());
    return wrap;
  }

  if (!entries.length) {
    wrap.appendChild(el('<div class="card empty-state"><h3>没有题目</h3><p>返回地图选择一关。</p></div>'));
    return wrap;
  }

  const entry = entries[ui.qIndex];
  const lv = entry.level;
  const q = entry.question;
  const total = entries.length;

  const top = el(
    '<div class="quiz-top">' +
      '<div class="quiz-top-left">' +
        '<button class="btn btn-soft" id="exitQuiz" type="button">退出</button>' +
        '<div><div class="quiz-title">' + escapeHtml(ui.review ? "错题复习" : lv.title) + '</div>' +
        '<div class="muted small">' + escapeHtml(ui.review ? "只做错题，答对后移出队列" : lv.subtitle) + '</div></div>' +
      '</div>' +
      '<div class="dots">' +
        entries.map((item, i) => {
          let cls = "dot";
          if (i === ui.qIndex) cls += " current";
          return '<span class="' + cls + '" title="第 ' + (i + 1) + ' 题"></span>';
        }).join("") +
      '</div>' +
    '</div>'
  );
  top.querySelector("#exitQuiz").onclick = () => { ui.view = "dashboard"; render(); };
  wrap.appendChild(top);

  const card = el(
    '<section class="question-card">' +
      '<div class="q-tag">' + escapeHtml(q.tag) + ' · 第 ' + (ui.qIndex + 1) + '/' + total + ' 题</div>' +
      '<h2 class="q-prompt">' + escapeHtml(q.prompt) + '</h2>' +
      '<div class="options" id="options"></div>' +
      '<div class="quiz-actions">' +
        '<button class="btn btn-primary" id="submitBtn" type="button" disabled>提交答案</button>' +
        '<button class="btn btn-soft hide" id="nextBtn" type="button">下一题</button>' +
      '</div>' +
      '<div id="feedbackSlot"></div>' +
    '</section>'
  );
  wrap.appendChild(card);

  const optionsBox = card.querySelector("#options");
  q.options.forEach((opt, i) => {
    const btn = el(
      '<button class="option" type="button">' +
        '<span class="option-key">' + String.fromCharCode(65 + i) + '</span>' +
        '<span>' + escapeHtml(opt) + '</span>' +
      '</button>'
    );
    btn.dataset.index = String(i);
    btn.onclick = () => {
      if (ui.answered) return;
      ui.selected = i;
      optionsBox.querySelectorAll(".option").forEach(o => o.classList.remove("selected"));
      btn.classList.add("selected");
      card.querySelector("#submitBtn").disabled = false;
    };
    optionsBox.appendChild(btn);
  });

  card.querySelector("#submitBtn").onclick = () => submitAnswer(card, entries);
  card.querySelector("#nextBtn").onclick = () => nextQuestion(entries);

  return wrap;
}

function submitAnswer(card, entries) {
  if (ui.answered || ui.selected === null) return;
  const entry = entries[ui.qIndex];
  const q = entry.question;
  const lv = entry.level;
  const correct = ui.selected === q.answer;

  ui.answered = true;
  ui.runAnswers[q.id] = correct;
  state.stats.answered += 1;
  if (correct) {
    state.stats.correct += 1;
    if (!state.correctOnce[q.id]) {
      state.correctOnce[q.id] = true;
      state.xp += 10;
    }
    delete state.wrong[q.id];
    toast("答对了 +10 XP");
  } else {
    state.wrong[q.id] = true;
    toast("已加入错题复习队列");
  }
  touchStreak();
  saveState();
  renderTopStats();

  card.querySelectorAll(".option").forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.answer) btn.classList.add("correct");
    if (i === ui.selected && !correct) btn.classList.add("wrong");
  });
  card.querySelector("#submitBtn").classList.add("hide");
  card.querySelector("#nextBtn").classList.remove("hide");
  card.querySelector("#nextBtn").textContent = (ui.qIndex === entries.length - 1) ? "查看结果" : "下一题";

  const fb = el(
    '<div class="feedback ' + (correct ? "ok" : "bad") + '">' +
      '<div class="feedback-head"><span class="mark">' + (correct ? "✓" : "!") + '</span>' + (correct ? "答对了" : "还差一点") + '</div>' +
      '<p>' + escapeHtml(q.explain) + '</p>' +
      (q.why ? '<p class="small muted">干扰项：' + escapeHtml(q.why) + '</p>' : '') +
      '<div class="two-col">' +
        '<div class="mini-card"><div class="label">项目里对应什么</div><div class="text">' + escapeHtml(q.project) + '</div></div>' +
        '<div class="mini-card"><div class="label">面试一句话</div><div class="text">' + escapeHtml(q.interview) + '</div></div>' +
      '</div>' +
    '</div>'
  );
  fb.appendChild(buildRatingRow(q.id));
  card.querySelector("#feedbackSlot").appendChild(fb);
  card.querySelector("#nextBtn").focus();
}

function nextQuestion(entries) {
  if (!ui.answered) return;
  if (ui.qIndex < entries.length - 1) {
    ui.qIndex += 1;
    ui.selected = null;
    ui.answered = false;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  } else {
    finishLevel(entries);
  }
}

function finishLevel(entries) {
  const finalCorrect = entries.filter(item => ui.runAnswers[item.question.id] === true).length;
  const total = entries.length;
  const pct = Math.round((finalCorrect / total) * 100);
  const lv = entries[0].level;
  const runXp = finalCorrect * 10;

  let badge = "";
  if (!ui.review) {
    const previous = state.completed[lv.id];
    const best = previous ? Math.max(previous.best, finalCorrect) : finalCorrect;
    state.completed[lv.id] = { best, total, date: todayKey() };
    if (pct >= 80) badge = lv.badge;
  }

  saveState();
  confetti();

  ui.result = {
    total,
    correct: finalCorrect,
    pct,
    badge,
    runXp,
    levelTitle: ui.review ? "错题复习" : lv.title,
    wrongQuestions: entries.filter(item => ui.runAnswers[item.question.id] === false).map(item => item.question)
  };
  render();
}

function renderResult() {
  const r = ui.result;
  const wrap = el('<div class="result-card card"></div>');
  const deg = Math.round((r.pct / 100) * 360);

  wrap.innerHTML =
    '<div class="q-tag">' + escapeHtml(r.levelTitle) + ' · 完成</div>' +
    '<div class="score-ring" style="--deg:' + deg + 'deg">' +
      '<div class="score-inner"><div class="score-num">' + r.pct + '%</div><div class="score-sub">正确率</div></div>' +
    '</div>' +
    (r.badge ? '<div class="badge-banner"><span class="badge-shape"></span>获得徽章：' + escapeHtml(r.badge) + '</div>' : '') +
    '<h2 style="margin-bottom:4px">' + (r.pct >= 80 ? "这关稳了" : "再看一遍解释") + '</h2>' +
    '<p class="muted">答对 ' + r.correct + ' / ' + r.total + ' 题，本次获得 ' + r.runXp + ' XP。</p>' +
    '<div class="quiz-actions" style="justify-content:center">' +
      '<button class="btn btn-primary" id="againBtn" type="button">再练一次</button>' +
      (r.wrongQuestions.length ? '<button class="btn btn-soft" id="reviewWrongBtn" type="button">复习本次错题</button>' : '') +
      '<button class="btn btn-ghost" id="backMapBtn" type="button">回到地图</button>' +
    '</div>' +
    (r.wrongQuestions.length ? '<div class="review-list">' + r.wrongQuestions.map(q => '<div class="review-row"><strong>' + escapeHtml(q.tag) + '</strong> · ' + escapeHtml(q.prompt) + '</div>').join("") + '</div>' : '<div class="small muted" style="margin-top:14px">没有错题。可以做下一关，或者去 Boss 练 90 秒讲稿。</div>');

  wrap.querySelector("#againBtn").onclick = () => {
    if (ui.review) {
      startLevel(0, true);
    } else {
      startLevel(ui.levelIndex, false);
    }
  };
  const reviewBtn = wrap.querySelector("#reviewWrongBtn");
  if (reviewBtn) {
    reviewBtn.onclick = () => {
      ui.review = true;
      ui.reviewQueue = Object.keys(state.wrong);
      ui.qIndex = 0;
      ui.selected = null;
      ui.answered = false;
      ui.result = null;
      if (!ui.reviewQueue.length) {
        toast("错题已经清空。");
        ui.view = "dashboard";
      }
      render();
    };
  }
  wrap.querySelector("#backMapBtn").onclick = () => { ui.view = "dashboard"; render(); };
  return wrap;
}

function startAdvanced(levelId) {
  const level = ADVANCED_LEVELS.find(lv => lv.id === levelId);
  if (!level) return;
  const entries = level.questions
    .filter(isObjective)
    .map(q => ({ level, question: q }));
  if (!entries.length) {
    const target = level.questions.find(q => q.type === "open");
    if (target) openQuestion({ level, question: target });
    return;
  }
  startFlow(entries, {
    title: level.title,
    subtitle: level.subtitle,
    mode: "advanced",
    levelId: level.id,
    showFeedback: true
  });
}

function initialSelection(q) {
  if (q.type === "multi") return [];
  if (q.type === "order") return [];
  return null;
}

function startFlow(entries, options) {
  if (ui.flow && ui.flow.timer && ui.flow.timer.handle) {
    clearInterval(ui.flow.timer.handle);
  }
  ui.view = "flow";
  ui.flow = {
    entries,
    index: 0,
    selected: initialSelection(entries[0].question),
    answered: false,
    results: {},
    finished: false,
    title: options.title || "训练",
    subtitle: options.subtitle || "",
    mode: options.mode || "drill",
    levelId: options.levelId || "",
    showFeedback: options.showFeedback !== false,
    timer: options.timerSeconds ? { total: options.timerSeconds, remaining: options.timerSeconds, handle: null } : null
  };
  if (ui.flow.timer) startFlowTimer();
  render();
}

function stopFlowTimer() {
  if (ui.flow && ui.flow.timer && ui.flow.timer.handle) {
    clearInterval(ui.flow.timer.handle);
    ui.flow.timer.handle = null;
  }
}

function startFlowTimer() {
  if (!ui.flow || !ui.flow.timer) return;
  stopFlowTimer();
  ui.flow.timer.handle = setInterval(() => {
    if (!ui.flow || !ui.flow.timer) return;
    ui.flow.timer.remaining -= 1;
    updateFlowTimerDisplay();
    if (ui.flow.timer.remaining <= 0) {
      stopFlowTimer();
      toast("时间到，自动交卷。");
      finishFlow();
    }
  }, 1000);
}

function updateFlowTimerDisplay() {
  const timer = ui.flow && ui.flow.timer;
  if (!timer) return;
  const text = formatTime(Math.max(0, timer.remaining));
  document.querySelectorAll("[data-flow-timer]").forEach(node => {
    node.textContent = text;
    node.classList.toggle("timer-warning", timer.remaining <= 60);
  });
}

function renderFlow() {
  const wrap = el('<div class="quiz-wrap"></div>');
  const flow = ui.flow;
  if (!flow || !flow.entries.length) {
    wrap.appendChild(el('<div class="card empty-state"><h3>没有题目</h3><p>返回进阶页重新选择。</p></div>'));
    return wrap;
  }
  if (flow.finished) {
    wrap.appendChild(renderFlowResult());
    return wrap;
  }

  const entry = flow.entries[flow.index];
  const q = entry.question;
  const total = flow.entries.length;

  const top = el(
    '<div class="quiz-top">' +
      '<div class="quiz-top-left">' +
        '<button class="btn btn-soft" id="exitFlow" type="button">退出</button>' +
        '<div><div class="quiz-title">' + escapeHtml(flow.title) + '</div>' +
        '<div class="muted small">' + escapeHtml(flow.subtitle) + '</div></div>' +
      '</div>' +
      (flow.timer ? '<div class="pill gold" data-flow-timer>' + formatTime(flow.timer.remaining) + '</div>' : '<div class="dots">' + flow.entries.map((item, i) => {
        let cls = "dot";
        if (i === flow.index) cls += " current";
        const result = flow.results[item.question.id];
        if (result) cls += result.correct ? " correct" : " wrong";
        return '<span class="' + cls + '" title="第 ' + (i + 1) + ' 题"></span>';
      }).join("") + '</div>') +
    '</div>'
  );
  top.querySelector("#exitFlow").onclick = () => {
    if (flow.mode === "mock" && !window.confirm("退出模拟面试？本次不计入成绩。")) return;
    stopFlowTimer();
    ui.view = flow.mode === "advanced" ? "advanced" : "review";
    render();
  };
  wrap.appendChild(top);

  const card = el(
    '<section class="question-card">' +
      '<div class="q-tag">' + escapeHtml(q.tag) +
        '<span class="type-badge ' + (q.type === "multi" ? "green" : q.type === "order" ? "" : "") + '">' + (TYPE_LABEL[q.type] || "单选") + '</span>' +
        ' · 第 ' + (flow.index + 1) + '/' + total + ' 题' +
      '</div>' +
      '<h2 class="q-prompt">' + escapeHtml(q.prompt) + '</h2>' +
      '<div id="questionBody"></div>' +
      '<div class="quiz-actions">' +
        '<button class="btn btn-primary" id="flowSubmit" type="button" disabled>提交答案</button>' +
        '<button class="btn btn-soft hide" id="flowNext" type="button">下一题</button>' +
      '</div>' +
      '<div id="flowFeedback"></div>' +
    '</section>'
  );
  wrap.appendChild(card);

  const body = card.querySelector("#questionBody");
  const submit = card.querySelector("#flowSubmit");

  if (q.type === "multi") {
    const box = el('<div class="options"></div>');
    q.options.forEach((opt, i) => {
      const btn = el(
        '<button class="option" type="button">' +
          '<span class="multi-mark"></span>' +
          '<span>' + escapeHtml(opt) + '</span>' +
        '</button>'
      );
      btn.dataset.index = String(i);
      if (flow.selected.includes(i)) btn.classList.add("selected");
      btn.onclick = () => {
        if (flow.answered) return;
        const pos = flow.selected.indexOf(i);
        if (pos >= 0) flow.selected.splice(pos, 1);
        else flow.selected.push(i);
        btn.classList.toggle("selected");
        submit.disabled = flow.selected.length === 0;
      };
      box.appendChild(btn);
    });
    body.appendChild(box);
    body.appendChild(el('<p class="order-hint">多选题：选全才得分，少选/多选都算错。</p>'));
    submit.disabled = flow.selected.length === 0;
  } else if (q.type === "order") {
    const box = el('<div class="order-list"></div>');
    q.options.forEach((opt, i) => {
      const btn = el(
        '<button class="order-item" type="button">' +
          '<span class="order-seq">' + (flow.selected.indexOf(i) >= 0 ? (flow.selected.indexOf(i) + 1) : "·") + '</span>' +
          '<span>' + escapeHtml(opt) + '</span>' +
        '</button>'
      );
      btn.dataset.index = String(i);
      btn.onclick = () => {
        if (flow.answered) return;
        const pos = flow.selected.indexOf(i);
        if (pos >= 0) flow.selected.splice(pos, 1);
        else flow.selected.push(i);
        render();
      };
      box.appendChild(btn);
    });
    body.appendChild(box);
    const hint = el(
      '<p class="order-hint">按正确顺序点击。再次点击可取消。当前已选 ' + flow.selected.length + '/' + q.options.length + ' 步。</p>'
    );
    body.appendChild(hint);
    const reset = el('<button class="btn btn-soft" type="button" style="margin-top:10px">重置顺序</button>');
    reset.onclick = () => { flow.selected = []; render(); };
    body.appendChild(reset);
    submit.disabled = flow.selected.length !== q.options.length;
  } else {
    const box = el('<div class="options"></div>');
    q.options.forEach((opt, i) => {
      const btn = el(
        '<button class="option" type="button">' +
          '<span class="option-key">' + String.fromCharCode(65 + i) + '</span>' +
          '<span>' + escapeHtml(opt) + '</span>' +
        '</button>'
      );
      btn.dataset.index = String(i);
      if (flow.selected === i) btn.classList.add("selected");
      btn.onclick = () => {
        if (flow.answered) return;
        flow.selected = i;
        box.querySelectorAll(".option").forEach(o => o.classList.remove("selected"));
        btn.classList.add("selected");
        submit.disabled = false;
      };
      box.appendChild(btn);
    });
    body.appendChild(box);
    submit.disabled = flow.selected === null;
  }

  submit.onclick = () => submitFlowAnswer(card);
  card.querySelector("#flowNext").onclick = () => nextFlowQuestion();

  return wrap;
}

function flowIsCorrect(q, selected) {
  const type = q.type || "single";
  if (type === "single" || type === "spot") return selected === q.answer;
  if (type === "multi") {
    const a = [...selected].sort((x, y) => x - y);
    const b = [...q.answer].sort((x, y) => x - y);
    return a.length === b.length && a.every((value, i) => value === b[i]);
  }
  if (type === "order") {
    return selected.length === q.answer.length && selected.every((value, i) => value === q.answer[i]);
  }
  return false;
}

function submitFlowAnswer(card) {
  const flow = ui.flow;
  if (!flow || flow.answered) return;
  const q = flow.entries[flow.index].question;
  const correct = flowIsCorrect(q, flow.selected);

  flow.answered = true;
  flow.results[q.id] = { correct, selected: JSON.parse(JSON.stringify(flow.selected)) };

  state.stats.answered += 1;
  if (correct) {
    state.stats.correct += 1;
    if (!state.correctOnce[q.id]) {
      state.correctOnce[q.id] = true;
      state.xp += 10;
    }
    delete state.wrong[q.id];
  } else {
    state.wrong[q.id] = true;
  }
  touchStreak();
  saveState();
  renderTopStats();

  card.querySelectorAll(".option").forEach(btn => {
    const index = Number(btn.dataset.index);
    btn.disabled = true;
    if (q.type === "multi") {
      if (q.answer.includes(index)) btn.classList.add("correct");
      if (flow.selected.includes(index) && !q.answer.includes(index)) btn.classList.add("wrong");
    } else {
      if (index === q.answer) btn.classList.add("correct");
      if (index === flow.selected && !correct) btn.classList.add("wrong");
    }
  });

  card.querySelector("#flowSubmit").classList.add("hide");
  const next = card.querySelector("#flowNext");
  next.classList.remove("hide");
  next.textContent = (flow.index === flow.entries.length - 1) ? "交卷 / 查看结果" : "下一题";
  next.focus();

  const slot = card.querySelector("#flowFeedback");
  if (flow.showFeedback) {
    slot.appendChild(buildFlowFeedback(q, correct));
  } else {
    slot.appendChild(el(
      '<div class="feedback">' +
        '<div class="feedback-head"><span class="mark" style="background:var(--gold)">i</span>已记录</div>' +
        '<p>模拟面试中不立即显示对错。交卷后统一复盘。</p>' +
      '</div>'
    ));
  }
}

function correctAnswerText(q) {
  if (q.type === "multi") return q.answer.map(i => String.fromCharCode(65 + i)).join("、");
  if (q.type === "order") return q.answer.map(i => q.options[i]).join(" → ");
  return String.fromCharCode(65 + q.answer);
}

function buildFlowFeedback(q, correct) {
  const fb = el(
    '<div class="feedback ' + (correct ? "ok" : "bad") + '">' +
      '<div class="feedback-head"><span class="mark">' + (correct ? "✓" : "!") + '</span>' + (correct ? "答对了" : "还差一点") + '</div>' +
      '<p>' + escapeHtml(q.explain) + '</p>' +
      (q.why ? '<p class="small muted">干扰项：' + escapeHtml(q.why) + '</p>' : '') +
      (correct ? "" : '<p class="small muted">正确答案：' + escapeHtml(correctAnswerText(q)) + '</p>') +
      '<div class="two-col">' +
        '<div class="mini-card"><div class="label">项目里对应什么</div><div class="text">' + escapeHtml(q.project) + '</div></div>' +
        '<div class="mini-card"><div class="label">面试一句话</div><div class="text">' + escapeHtml(q.interview) + '</div></div>' +
      '</div>' +
    '</div>'
  );
  fb.appendChild(buildRatingRow(q.id));
  return fb;
}

function buildRatingRow(qid) {
  const row = el('<div class="rate-row"><span class="rate-label">这道题你的感觉？</span></div>');
  const options = [
    { value: 0, label: "秒懂" },
    { value: 1, label: "想了一会" },
    { value: 2, label: "没思路" }
  ];
  options.forEach(opt => {
    const btn = el('<button class="rate-btn ' + (state.ratings[qid] === opt.value ? "chosen" : "") + '" type="button">' + opt.label + '</button>');
    btn.onclick = () => {
      applyRating(qid, opt.value);
      row.querySelectorAll(".rate-btn").forEach(node => node.classList.remove("chosen"));
      btn.classList.add("chosen");
      const note = row.querySelector(".rate-note");
      if (note) note.textContent = "已记录：" + scheduleLabel(qid) + "。0/1/2 会影响复习间隔。";
    };
    row.appendChild(btn);
  });
  row.appendChild(el('<span class="rate-note">0/1/2 会影响复习间隔：秒懂拉长，没思路回到今天。</span>'));
  return row;
}

function nextFlowQuestion() {
  const flow = ui.flow;
  if (!flow || !flow.answered) return;
  if (flow.index < flow.entries.length - 1) {
    flow.index += 1;
    flow.answered = false;
    flow.selected = initialSelection(flow.entries[flow.index].question);
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  } else {
    finishFlow();
  }
}

function finishFlow() {
  const flow = ui.flow;
  if (!flow || flow.finished) return;
  stopFlowTimer();
  flow.finished = true;

  const total = flow.entries.length;
  const correct = flow.entries.filter(item => {
    const result = flow.results[item.question.id];
    return result && result.correct;
  }).length;
  const pct = Math.round((correct / total) * 100);

  let badge = "";
  if (flow.mode === "advanced" && flow.levelId) {
    const previous = state.advCompleted[flow.levelId];
    const best = previous ? Math.max(previous.best, correct) : correct;
    state.advCompleted[flow.levelId] = { best, total, date: todayKey() };
    const level = ADVANCED_LEVELS.find(lv => lv.id === flow.levelId);
    if (pct >= 80 && level) badge = level.title;
  }
  if (flow.mode === "mock") {
    state.mockHistory = state.mockHistory || [];
    state.mockHistory.push({ date: todayKey(), pct, correct, total });
    state.mockHistory = state.mockHistory.slice(-20);
  }

  flow.badge = badge;
  flow.correct = correct;
  flow.pct = pct;
  saveState();
  confetti();
  render();
}

function renderFlowResult() {
  const flow = ui.flow;
  const wrap = el('<div class="result-card card"></div>');
  const deg = Math.round((flow.pct / 100) * 360);

    return (
      '<div class="detail-row">' +

        '<div class="detail-explain">' + escapeHtml(item.question.explain) + (item.question.why ? ' ' + escapeHtml(item.question.why) : '') + '</div>' +
      '</div>'

  wrap.innerHTML =
    '<div class="q-tag">' + escapeHtml(flow.title) + ' · 完成</div>' +
    '<div class="score-ring" style="--deg:' + deg + 'deg">' +
      '<div class="score-inner"><div class="score-num">' + flow.pct + '%</div><div class="score-sub">正确率</div></div>' +

    '<h2 style="margin-bottom:4px">' + (flow.pct >= 80 ? "这轮稳了" : flow.mode === "mock" ? "看看复盘，再打一轮" : "再看一遍解释") + '</h2>' +
    '<p class="muted">答对 ' + flow.correct + ' / ' + flow.entries.length + ' 题。' +
      (flow.mode === "mock" ? "模拟面试建议目标 70% 以上。" : "") + '</p>' +
    '<div class="quiz-actions" style="justify-content:center">' +
      '<button class="btn btn-primary" id="flowAgain" type="button">' + (flow.mode === "mock" ? "再模拟一次" : "再练一次") + '</button>' +
      '<button class="btn btn-soft" id="flowReview" type="button">复习错题</button>' +
      '<button class="btn btn-ghost" id="flowBack" type="button">回到地图</button>' +
    '</div>' +
    '<div class="detail-list">' + details + '</div>';

  wrap.querySelector("#flowAgain").onclick = () => {

    else if (flow.mode === "mock") startMock();

    if (!ids.length) { toast("没有错题，先保持。"); return; }
    startDrill(ids, "错题复习");
  };

}

  const entries = ids.map(id => map[id]).filter(Boolean);

  wrap.appendChild(el(
    '<div style="margin-bottom:14px">' +

      '<div class="card"><div class="stat-big">' + Object.keys(state.ratings).length + '</div><div class="stat-label">已自评题目</div></div>' +
      '<div class="card"><div class="stat-big">' + Object.keys(state.schedule).length + '</div><div class="stat-label">已排期</div></div>' +

  wrap.appendChild(summary);

  if (!entries.length) {
    wrap.appendChild(el(
      '<div class="card empty-state">' +
        '<h3>今天没有到期复习</h3>' +
        '<p>去一刷或二刷，答完后用 0/1/2 自评，系统会安排下次复习。</p>' +
        '<button class="btn btn-primary" id="reviewGo" type="button">去闯关</button>' +

    ));

    '<div class="card" style="margin-bottom:16px">' +
      '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap">' +

      '</div>' +
      '<div class="review-list" id="dueList" style="margin-top:12px"></div>' +

  ));

      '<div class="review-row" style="display:flex;justify-content:space-between;gap:10px;align-items:center">' +

      '</div>'

function startDrill(ids, title) {
  const map = allQuestionsById();
  const entries = ids.map(id => map[id]).filter(item => item && isObjective(item.question));
  if (!entries.length) {
    toast("没有可复习的客观题。");
    return;
  }
  startFlow(entries, {
    title,
    subtitle: "错题与到期复习 · 答完按 0/1/2 自评",
    mode: "drill",
    showFeedback: true
  });
}

function startWeakTag(tag) {
  const entries = allObjectiveEntries().filter(item => (item.question.tag || "其他") === tag);
  if (!entries.length) {
    toast("这个标签下没有可练的客观题。");
    return;
  }
  const ids = entries.slice(0, 6).map(item => item.question.id);
  startDrill(ids, "弱项训练 · " + tag);
}

function startMock() {
  const basic = LEVELS.flatMap(lv => lv.questions.filter(q => q.type !== "open").map(q => ({ level: lv, question: q })));
  const advanced = ADVANCED_LEVELS
    .filter(lv => lv.stage === "apply")
    .flatMap(lv => lv.questions.filter(isObjective).map(q => ({ level: lv, question: q })));

  function pick(list, count) {
    const copy = [...list];
    const out = [];
    while (copy.length && out.length < count) {
      out.push(copy.splice(Math.floor(Math.random() * copy.length), 1)[0]);
    }
    return out;
  }

  const selected = [...pick(basic, 4), ...pick(advanced, 4)];
  if (!selected.length) { toast("题库为空。"); return; }
  selected.sort(() => Math.random() - 0.5);
  startFlow(selected, {
    title: "模拟面试",
    subtitle: "8 题 · 12 分钟 · 交卷后统一复盘",
    mode: "mock",
    showFeedback: false,
    timerSeconds: 12 * 60
  });
}

/* ---------- 三刷口述题 ---------- */

function openQuestion(target) {
  ui.view = "open";
  ui.open = {
    level: target.level,
    question: target.question,
    showRef: false,
    checks: {},
    text: "",
    result: null
  };
  render();
}

function renderOpen() {
  const wrap = el('<div class="quiz-wrap"></div>');
  const current = ui.open;
  if (!current) {
    wrap.appendChild(el('<div class="card empty-state"><h3>没有口述题</h3><p>回到进阶页选择。</p></div>'));
    return wrap;
  }
  const q = current.question;
  const rubric = q.rubric || [];

  const top = el(
    '<div class="quiz-top">' +
      '<div class="quiz-top-left">' +
        '<button class="btn btn-soft" id="openBack" type="button">返回三刷</button>' +
        '<div><div class="quiz-title">白板口述</div><div class="muted small">' + escapeHtml(q.tag) + ' · 先讲 60 到 90 秒</div></div>' +
      '</div>' +
      '<div class="pill gold">自评制</div>' +
    '</div>'
  );
  top.querySelector("#openBack").onclick = () => { ui.view = "advanced"; render(); };
  wrap.appendChild(top);

  if (current.result) {
    const r = current.result;
    const deg = Math.round((r.checked / r.total) * 360);
    const card = el(
      '<section class="open-card">' +
        '<div class="q-tag">' + escapeHtml(q.tag) + ' · 自评结果</div>' +
        '<div class="score-ring" style="--deg:' + deg + 'deg;width:120px;height:120px;margin-bottom:12px">' +
          '<div class="score-inner"><div class="score-num" style="font-size:28px">' + r.checked + '/' + r.total + '</div><div class="score-sub">评分点</div></div>' +
        '</div>' +
        '<h2 style="margin:0 0 8px">' + (r.checked === r.total ? "可以进下一题了" : "把没勾到的点补进讲稿") + '</h2>' +
        '<div class="reference"><div class="label">参考答案</div>' + escapeHtml(q.reference) + '</div>' +
        '<div class="rubric">' + rubric.map((line, i) => '<div class="rubric-row ' + (current.checks[i] ? "checked" : "") + '"><span class="rubric-box"></span><span>' + escapeHtml(line) + '</span></div>').join("") + '</div>' +
        '<div class="quiz-actions" style="justify-content:flex-start">' +
          '<button class="btn btn-primary" id="openAgain" type="button">再讲一次</button>' +
          '<button class="btn btn-ghost" id="openNext" type="button">下一道口述题</button>' +
        '</div>' +
      '</section>'
    );
    card.querySelector("#openAgain").onclick = () => openQuestion({ level: current.level, question: q });
    card.querySelector("#openNext").onclick = () => {
      const all = openQuestions();
      const idx = all.findIndex(item => item.question.id === q.id);
      const next = all[(idx + 1) % all.length];
      openQuestion(next);
    };
    wrap.appendChild(card);
    return wrap;
  }

  const card = el(
    '<section class="open-card">' +
      '<div class="q-tag">' + escapeHtml(q.tag) + ' · 口述题</div>' +
      '<h2 class="open-prompt">' + escapeHtml(q.prompt) + '</h2>' +
      '<p class="small muted">先不要看答案。用嘴讲，或者在下面写关键词。讲完再展开参考答案。</p>' +
      '<textarea class="open-textarea" id="openAnswer" placeholder="写下你的讲稿关键词，或直接口头讲...">' + escapeHtml(current.text || "") + '</textarea>' +
      '<div class="quiz-actions" style="justify-content:flex-start">' +
        '<button class="btn btn-primary" id="toggleRef" type="button">' + (current.showRef ? "收起参考答案" : "查看参考答案") + '</button>' +
        '<button class="btn btn-soft" id="submitOpen" type="button">提交自评</button>' +
      '</div>' +
      '<div id="refSlot"></div>' +
      '<div class="rubric" id="rubricSlot"></div>' +
    '</section>'
  );
  wrap.appendChild(card);

  const textarea = card.querySelector("#openAnswer");
  textarea.addEventListener("input", e => { current.text = e.target.value; });

  const refSlot = card.querySelector("#refSlot");
  function renderReference() {
    refSlot.innerHTML = current.showRef
      ? '<div class="reference"><div class="label">参考答案</div>' + escapeHtml(q.reference) + '</div>'
      : "";
  }
  renderReference();

  card.querySelector("#toggleRef").onclick = () => {
    current.showRef = !current.showRef;
    card.querySelector("#toggleRef").textContent = current.showRef ? "收起参考答案" : "查看参考答案";
    renderReference();
  };

  const rubricSlot = card.querySelector("#rubricSlot");
  rubric.forEach((line, i) => {
    const row = el(
      '<div class="rubric-row ' + (current.checks[i] ? "checked" : "") + '">' +
        '<span class="rubric-box"></span><span>' + escapeHtml(line) + '</span>' +
      '</div>'
    );
    row.onclick = () => {
      current.checks[i] = !current.checks[i];
      row.classList.toggle("checked");
    };
    rubricSlot.appendChild(row);
  });

  card.querySelector("#submitOpen").onclick = () => {
    const checked = rubric.filter((_, i) => current.checks[i]).length;
    if (checked === 0) {
      toast("至少勾选一个你讲到的评分点。");
      return;
    }
    const rating = checked === rubric.length ? 0 : checked >= Math.ceil(rubric.length / 2) ? 1 : 2;
    applyRating(q.id, rating);
    state.openDone[q.id] = checked;
    saveState();
    current.result = { checked, total: rubric.length, rating };
    render();
  };

  return wrap;
}

function renderGlossary() {

/* ---------- 计时器 ---------- */

function toggleFocusTimer() {
  if (focusTimer.running) {
    clearInterval(focusTimer.handle);
    focusTimer.running = false;
    updateTimerDisplay();
    return;
  }
  focusTimer.running = true;
  focusTimer.handle = setInterval(() => {
    focusTimer.remaining -= 1;
    if (focusTimer.remaining <= 0) {
      focusTimer.remaining = 0;
      clearInterval(focusTimer.handle);
      focusTimer.running = false;
      toast("10 分钟到了，站起来走两分钟。");
      confetti();
    }
    updateTimerDisplay();
  }, 1000);
  updateTimerDisplay();
}

function resetFocusTimer() {
  clearInterval(focusTimer.handle);
  focusTimer.running = false;
  focusTimer.remaining = focusTimer.total;
  updateTimerDisplay();
}

function formatTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}

function updateTimerDisplay() {
  const text = formatTime(focusTimer.remaining);
  document.querySelectorAll("[data-timer]").forEach(node => { node.textContent = text; });
  const btn = document.getElementById("focusBtn");
  if (btn) btn.textContent = (focusTimer.running ? "专注中 " : "专注 ") + text;
}

function toggleBossTimer() {
  if (bossTimer.running) {
    clearInterval(bossTimer.handle);
    bossTimer.running = false;
    updateBossTimerDisplay();
    return;
  }
  if (bossTimer.remaining <= 0) bossTimer.remaining = bossTimer.total;
  bossTimer.running = true;
  bossTimer.handle = setInterval(() => {
    bossTimer.remaining -= 1;
    if (bossTimer.remaining <= 0) {
      bossTimer.remaining = 0;
      clearInterval(bossTimer.handle);
      bossTimer.running = false;
      toast("90 秒到了。停一下，回听自己的录音。");
      confetti();
    }
    updateBossTimerDisplay();
  }, 1000);
  updateBossTimerDisplay();
}

function resetBossTimer() {
  clearInterval(bossTimer.handle);
  bossTimer.running = false;
  bossTimer.remaining = bossTimer.total;
  updateBossTimerDisplay();
}

function updateBossTimerDisplay() {
  const text = formatTime(bossTimer.remaining);
  document.querySelectorAll("[data-boss-timer]").forEach(node => { node.textContent = text; });
}

/* ---------- 全局事件 ---------- */

document.getElementById("focusBtn").onclick = () => {
  if (ui.view !== "plan" && ui.view !== "boss") {
    ui.view = "plan";
    render();
  }
  toggleFocusTimer();
};

document.getElementById("resetBtn").onclick = () => {
  const ok = window.confirm("确定清空本机学习进度吗？XP、通关记录和错题都会删除。");
  if (!ok) return;
  state = { ...defaultState, stats: { ...defaultState.stats } };
  saveState();
  ui.view = "dashboard";
  ui.result = null;
  render();
  toast("进度已重置。");
};

document.addEventListener("keydown", (e) => {
  const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : "";
  if (tag === "input" || tag === "textarea") return;

  if (e.key === "Escape") {
    if (ui.view === "quiz") { ui.view = "dashboard"; render(); }
    return;
  }

  if (ui.view === "flow" && ui.flow && !ui.flow.finished) {
    if (e.key >= "1" && e.key <= "9" && !ui.flow.answered) {
      const idx = Number(e.key) - 1;
      const btn = document.querySelector('.option[data-index="' + idx + '"], .order-item[data-index="' + idx + '"]');
      if (btn) { btn.click(); e.preventDefault(); }
    } else if (e.key === "Enter") {
      if (ui.flow.answered) {
        const next = document.getElementById("flowNext");
        if (next && !next.classList.contains("hide")) next.click();
      } else {
        const submit = document.getElementById("flowSubmit");
        if (submit && !submit.disabled) submit.click();
      }
      e.preventDefault();
    } else if (e.key === "Escape") {
      const exit = document.getElementById("exitFlow");
      if (exit) exit.click();
      e.preventDefault();
    }
    return;
  }

  if (ui.view === "quiz" && !ui.result) {
    const entries = currentQuestions();
    if (!entries.length) return;
    const q = entries[ui.qIndex].question;
    if (!ui.answered && e.key >= "1" && e.key <= "4") {
      const idx = Number(e.key) - 1;
      if (idx < q.options.length) {
        ui.selected = idx;
        document.querySelectorAll(".option").forEach(o => o.classList.remove("selected"));
        const btn = document.querySelector('.option[data-index="' + idx + '"]');
        if (btn) btn.classList.add("selected");
        const submit = document.getElementById("submitBtn");
        if (submit) submit.disabled = false;
      }
      e.preventDefault();
    } else if (e.key === "Enter") {
      if (ui.answered) {
        const next = document.getElementById("nextBtn");
        if (next && !next.classList.contains("hide")) next.click();
      } else {
        const submit = document.getElementById("submitBtn");
        if (submit && !submit.disabled) submit.click();
      }
      e.preventDefault();
    }
  } else if (ui.view === "flashcards") {
    if (e.key === " " || e.key === "Enter") {
      ui.flashFlipped = !ui.flashFlipped;
      render();
      e.preventDefault();
    } else if (e.key === "ArrowRight") {
      ui.flashIndex = (ui.flashIndex + 1) % GLOSSARY.length;
      ui.flashFlipped = false;
      render();
      e.preventDefault();
    } else if (e.key === "ArrowLeft") {
      ui.flashIndex = (ui.flashIndex - 1 + GLOSSARY.length) % GLOSSARY.length;
      ui.flashFlipped = false;
      render();
      e.preventDefault();
    }
  }
});

/* ---------- 启动 ---------- */

render();

const storageBadge = document.getElementById("storageBadge");
if (storageBadge) {
  storageBadge.onclick = () => {
    if (storageMode === "remote") {
      toast(syncState === "error" ? "SQLite 同步失败，正在重试..." : "SQLite 已同步，点击可重新检查");
    } else {
      toast("正在尝试连接本地 SQLite 服务...");
    }
    initRemoteSync(true);
  };
}

window.addEventListener("pagehide", () => {
  if (storageMode === "remote") {
    clearTimeout(syncTimer);
    pushRemoteState();
  }
});

initRemoteSync();
</script>
</body>
</html>
